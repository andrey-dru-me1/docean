[package]
# NOTE: no hyphen. cargokit derives the linked library name from the package
# name, and Cargo maps `-` to `_` in the produced `lib<name>.a`/`.dylib` files,
# so `docer-core` would break the pod/CMake link step on macOS/iOS.
name = "docer_core"
version = "0.1.0"
edition = "2021"
description = "Core engine for docer: document storage, organization, search, AI, and sync."
license = "MIT"

# flutter_rust_bridge requires the crate to be buildable as both a dynamic and
# static library. The cargokit build glue links whichever the platform needs.
[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
# Pinned exactly; the Dart side (`flutter_rust_bridge`) and the codegen CLI
# (`flutter_rust_bridge_codegen`) must all stay on the same version.
flutter_rust_bridge = "=2.13.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"

# --- peer-to-peer networking (core::net) -----------------------------------
# rust-libp2p for device discovery (mDNS) and connection management over
# TCP/QUIC. `futures` is needed for the swarm event loop and stream plumbing.
libp2p = { version = "0.56", default-features = false, features = [
    "mdns", "tokio", "tcp", "quic", "dns", "noise", "yamux",
    "identify", "ping", "macros", "ed25519",
] }
futures = "0.3"
rand = "0.8"

# --- async runtime (shared by ai + net) -------------------------------------
tokio = { version = "1", features = ["full"] }

# --- pluggable AI providers (core::ai) -------------------------------------
# reqwest: async HTTP client for the Ollama and OpenAI-compatible backends.
# `json` for typed bodies, `rustls` + `webpki-roots` for a self-contained TLS
# stack (no system OpenSSL dependency, keeping cargokit builds simple).
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "webpki-roots", "system-proxy"] }
# keyring: OS credential store (macOS Keychain, Windows Credential Manager,
# freedesktop Secret Service) for persisting provider API keys securely.
# Default `v1` feature enables the native stores for all supported platforms.
keyring = "4"
# tracing/logging for provider lifecycle + model downloads.
log = "0.4"

# --- local storage (src/storage) -------------------------------------------
# SQLite via `rusqlite` (explicit storage requirement) with an in-code
# migration mechanism. `bundled` compiles SQLite from source so there is no
# system library dependency, keeping the cargokit cross-platform build
# (macOS/Windows/Linux/Android/iOS) self-contained.
rusqlite = { version = "0.37", features = ["bundled", "serde_json"] }
# Content hashing for the content-addressed blob store + integrity checks.
sha2 = "0.10"

# ---------------------------------------------------------------------------
# Planned per-module dependencies (pinned choices; activate when implementing).
# These are documented here so later tasks build on the same choices without
# conflict. Modules not yet implemented keep their crates commented out.
#
# search         -> tantivy = "0.26"    (full-text inverted index)
#                   fastembed = "6"     (local ONNX embeddings for semantic search)
#                   usearch = "2"       (HNSW vector similarity index)
# ai             -> tokio = { version = "1", features = ["full"] }
#                   reqwest = { version = "0.13", features = ["json", "stream"] }
# sync           -> iroh = "1"          (P2P transport over QUIC)
#                   automerge = "0.11"  (CRDT for conflict-free merge)
# observability  -> tracing = "0.1", tracing-subscriber = "0.3"
#
# auto_org is implemented with HAND-ROLLED, deterministic primitives (TF-IDF,
# k-means, k-NN, MinHash/LSH) and needs no external ML crates. linfa/
# linfa-clustering were evaluated and replaced (see README §7a): their k-means
# is randomly seeded and GMM needs native BLAS, both violating the determinism
# and self-contained-build requirements. The generative filename tier reuses
# the ai module; the classic-ML path has zero ai dependency.
# ---------------------------------------------------------------------------

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[profile.release]
lto = true
codegen-units = 1
strip = true
